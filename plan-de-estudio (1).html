    c.fillStyle='#1b1b1b';c.font=`500 15px ${F}`;
    const hr=`${fmtH(dn).replace('h','')}/${fmtH(t.hours)}`;
    c.textAlign='right';c.font=`700 15px ${F}`;c.fillText(hr,x+cw-18,yy);const hw=c.measureText(hr).width;c.textAlign='left';
    c.font=`500 15px ${F}`;c.fillText(fit(c,`${t.easy?'★ ':''}${t.name} (${t.subject})${t.prio==='extra'?' · extra':''}`,cw-70-hw),x+44,yy);
    yy+=30;});
  c.strokeStyle=NAVY;c.lineWidth=1.5;c.beginPath();c.moveTo(x+18,yy-10);c.lineTo(x+cw-18,yy-10);c.stroke();
  const list=(title,arr)=>{if(!arr.length)return;yy+=26;c.fillStyle=NAVY;c.font=`700 15px ${F}`;c.fillText(title,x+18,yy);yy+=8;
    arr.forEach(b=>{const t=T(b.taskId);if(!t)return;yy+=26;c.fillStyle='#333';c.font=`500 14px ${F}`;c.fillText(fit(c,`· ${t.name} (${t.subject}) ${fmtH(b.h)}`,cw-36),x+18,yy);});yy+=6;};
  list('📥 Bandeja (sin colocar)',tray);list('🗄 Recámara',res);

function jpegToPdf(dataUrl,pw,ph){
  const bin=atob(dataUrl.split(',')[1]);const img=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)img[i]=bin.charCodeAt(i);
  const Wp=842,Hp=Math.round(842*ph/pw);
  const enc=s=>new TextEncoder().encode(s);
  const parts=[],offs=[];let len=0;const push=u=>{parts.push(u);len+=u.length;};
  push(enc('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
  const obj=(n,body)=>{offs[n]=len;push(enc(`${n} 0 obj\n${body}\nendobj\n`));};
  obj(1,'<< /Type /Catalog /Pages 2 0 R >>');
  obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${Wp} ${Hp}] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>`);
  offs[4]=len;push(enc(`4 0 obj\n<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>\nstream\n`));push(img);push(enc('\nendstream\nendobj\n'));
  const cs=`q ${Wp} 0 0 ${Hp} 0 0 cm /Im0 Do Q`;
  obj(5,`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  const xref=len;let x='xref\n0 6\n0000000000 65535 f \n';for(let i=1;i<=5;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
  push(enc(x+`trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`));
  return new Blob(parts,{type:'application/pdf'});
}
async function openExport(){
  ui.modal={type:'export',mode:ui.exportMode||'week',img:null};renderModal();
  const cv=await buildExportCanvas(ui.modal.mode);
  if(ui.modal&&ui.modal.type==='export'){ui.exportCanvas=cv;ui.modal.img=cv.toDataURL('image/png');renderModal();}

async function doExport(kind){
  const cv=ui.exportCanvas;if(!cv)return;
  const name='plan-estudio-'+today();
  let data,filename;
  if(kind==='png'){data=await new Promise(r=>cv.toBlob(r,'image/png'));filename=name+'.png';}
  else{data=jpegToPdf(cv.toDataURL('image/jpeg',0.93),cv.width,cv.height);filename=name+'.pdf';}
  let dl=null;try{if(window.claude&&claude.use)dl=await claude.use('downloads');}catch(e){}
  if(dl){try{await dl.save({filename,data});toast('Descargado ✓');}catch(e){if(e&&e.code==='declined')return;fallbackDownload(data,filename);}}
  else fallbackDownload(data,filename);
}
function fallbackDownload(blob,filename){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();}catch(e){}
  if(inClaude())toast('Si no se ha descargado, mantén pulsada la vista previa para guardarla');else toast('Descargado ✓');
}

  let warn='';

  openModal({type:'sugg',title:`No pasa nada 👍`,lead:`Opciones para recolocar <b>${esc(t.name)}</b> (${fmtH(b.h)}). Lo he dejado en la bandeja mientras decides.`,warn,items});
}
function afterFreed(d,s,h,reason){

  openModal({type:'fill',d:dd,s:ss,h:Math.min(3,r05(h))||1,reason});
}

    case 'delspecial':{const d=a.dataset.d;commit(()=>{delete S.days[d];},'Vuelve a tu semana tipo');break;}
    case 'rangedl':commit(()=>{S.range.end=a.dataset.d;},'Guardado');break;
    case 'range_old':{const s=document.getElementById('rs').value,en=document.getElementById('re').value;if(!s||!en||en<s){toast('Revisa las fechas');break;}commit(()=>{S.range={start:s,end:en};},'Rango actualizado');break;}
    case 'range':{const en=document.getElementById('re').value;if(!en){toast('Elige una fecha');break;}commit(()=>{S.range.end=en;},'Guardado');break;}
    case 'bulk_old':{const g=i=>Math.max(0,r05(+document.getElementById(i).value||0));const wa=g('wa'),wp=g('wp'),ea=g('ea'),ep=g('ep');
      commit(()=>{dateList().forEach(d=>{const w=pd(d).getDay();const we=w===0||w===6;S.days[d]={...dayCfg(d),am:we?ea:wa,pm:we?ep:wp};});},'Horas aplicadas');break;}
  }
}
function planToast(){const r=ui._r||{placed:0,toTray:0};toast(`Plan creado: ${fmtH(r.placed)} colocadas${r.toTray?` · ${fmtH(r.toTray)} no caben (bandeja)`:''}`,true);}

document.addEventListener('submit',e=>{
  if(e.target.id!=='tf')return;e.preventDefault();
  const f=new FormData(e.target);const m=ui.modal;
  const colRaw=f.get('color')||'';
  const v={name:(f.get('name')||'').trim(),subject:(f.get('subject')||'').trim()||'Otra',hours:Math.max(0.5,r05(+f.get('hours')||1)),prio:f.get('prio'),deadline:f.get('deadline')||'',maxBlock:Math.max(0.5,r05(+f.get('maxBlock')||3)),easy:!!f.get('easy')};
  if(!v.name)return;
  commit(()=>{
    if(colRaw!==''){S.colors[subjKey(v.subject)]=/^\d+$/.test(colRaw)?+colRaw:colRaw;}
    ensureColor(v.subject);
    if(m.id){const t=T(m.id);const old=t.prio;Object.assign(t,v);
      // si bajan las horas, quito bloques futuros desde el final
      let over=r05(blockedH(t)-t.hours);
      if(over>0){const cand=S.blocks.filter(b=>b.taskId===t.id&&b.status!=='done').sort((a,b)=>(b.zone==='day'?b.date+b.slot:'z')<(a.zone==='day'?a.date+a.slot:'z')?-1:1);
        for(const b of cand){if(over<=0)break;if(b.h<=over){over=r05(over-b.h);S.blocks=S.blocks.filter(x=>x!==b);}else{b.h=r05(b.h-over);over=0;}}}
      if(old!=='extra'&&t.prio==='extra')S.blocks.forEach(b=>{if(b.taskId===t.id&&b.status!=='done')toZone(b.id,'reserve');});
    }else S.tasks.push({id:uid(),...v});
  },m.id?'Tarea guardada':'Tarea añadida · pulsa ✨ Crear plan');
});
document.addEventListener('change',e=>{
  if(e.target.id==='bkimp'&&e.target.files&&e.target.files[0]){importBackup(e.target.files[0]);e.target.value='';return;}
  const c=e.target.dataset&&e.target.dataset.cap;const n=e.target.dataset&&e.target.dataset.note;
  if(c){const [d,s]=c.split('|');commit(()=>setCap(d,s,e.target.value),null);}
  if(n!=null&&n!==undefined&&e.target.dataset.note){commit(()=>{S.days[n]={...(S.days[n]||{}),note:e.target.value.trim()};},null);}
  const tp=e.target.dataset&&e.target.dataset.tpl;
  if(tp){const [w,s]=tp.split('|');commit(()=>{S.template=S.template||emptyTemplate();S.template[w]={...S.template[w],[s]:Math.max(0,r05(+e.target.value||0))};},null);}
});
/* arrastrar (ordenador) */
document.addEventListener('dragstart',e=>{const bk=e.target.closest&&e.target.closest('[data-blk]');if(!bk)return;e.dataTransfer.setData('text/plain',bk.dataset.blk);e.dataTransfer.effectAllowed='move';});
document.addEventListener('dragover',e=>{const dz=e.target.closest&&e.target.closest('[data-drop]');if(!dz)return;e.preventDefault();document.querySelectorAll('.hover').forEach(x=>x!==dz&&x.classList.remove('hover'));dz.classList.add('hover');});
document.addEventListener('dragleave',e=>{const dz=e.target.closest&&e.target.closest('[data-drop]');if(dz&&!dz.contains(e.relatedTarget))dz.classList.remove('hover');});
document.addEventListener('drop',e=>{const dz=e.target.closest&&e.target.closest('[data-drop]');if(!dz)return;e.preventDefault();dz.classList.remove('hover');const id=e.dataTransfer.getData('text/plain');if(id&&B(id))dropTo(id,dz.dataset.drop);});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal)closeModal();else if(ui.moving){ui.moving=null;render();}}});

render();
</script>
</body>
